<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Archivo;src:url(../../../tools/piezas/fonts/Archivo.ttf)}
html,body{margin:0;width:1080px;height:1350px;overflow:hidden;background:#000}
.bg{position:absolute;left:0;top:0;width:1080px;height:1440px;object-fit:cover}

h1{position:absolute;top:94px;left:56px;right:56px;margin:0;font:900 76px/0.95 Archivo;font-stretch:75%;color:#fff;text-transform:uppercase;
 -webkit-text-stroke:5px #000;paint-order:stroke fill;text-shadow:5px 5px 0 #ff4fb3}
