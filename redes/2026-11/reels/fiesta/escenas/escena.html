<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:AB;src:url(../../../../../tools/piezas/fonts/ArchivoBlack-Regular.ttf)}
*{margin:0;box-sizing:border-box}
#c{width:860px;height:1140px;position:relative;overflow:hidden;font-family:AB;perspective:1400px}
.bg{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(14px) brightness(.55) saturate(1.2)}
.vig{position:absolute;inset:0;background:radial-gradient(closest-side,transparent 55%,rgba(10,4,20,.55))}
/* Carta Fondo Blanco: índigo con confeti, texto blanco */
.card{position:absolute;left:150px;top:250px;width:560px;height:780px;border-radius:44px;
 background:radial-gradient(circle at 30% 20%,#4a3aa8,#2d2486 60%,#231c6e);box-shadow:0 40px 80px rgba(0,0,0,.6),0 0 0 3px rgba(255,255,255,.08) inset;
 color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:60px 54px;transform-style:preserve-3d}
.card .conf{position:absolute;inset:0;border-radius:44px;background:
 radial-gradient(circle,#59d3d3 2px,transparent 3px) 40px 60px/120px 140px,radial-gradient(circle,#ff4fb3 2px,transparent 3px) 90px 20px/150px 170px;opacity:.35}
.card p{font-size:54px;line-height:1.14;position:relative}
.card .pk{color:#ff5fb8}
.stop{margin-top:46px;width:200px;height:200px;background:#e2267f;clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%);display:flex;align-items:center;justify-content:center;position:relative}
.stop::before{content:"";position:absolute;inset:10px;background:#fff;clip-path:inherit}
.stop::after{content:"";position:absolute;inset:18px;background:#e2267f;clip-path:inherit}
.stop span{position:relative;z-index:2;font-size:56px;color:#fff;letter-spacing:2px}
.brand{position:absolute;bottom:34px;font-size:24px;opacity:.65;letter-spacing:3px}
.in{animation:entra 3.6s cubic-bezier(.2,.8,.2,1) both}
@keyframes entra{0%{transform:translateY(700px) rotateX(55deg) rotateZ(-14deg) scale(.7)}22%{transform:translateY(0) rotateX(0) rotateZ(3deg) scale(1.02)}30%{transform:rotateZ(-1deg) scale(1)}100%{transform:rotateZ(1.5deg) scale(1.06)}}
/* Ficha de la torre: madera con etiqueta morada */
.block{position:absolute;left:40px;top:430px;width:780px;height:250px;border-radius:10px;
 background:linear-gradient(180deg,#f3dcae,#e2c38c 60%,#cfa970),repeating-linear-gradient(90deg,rgba(120,80,30,.08) 0 3px,transparent 3px 22px);
 background-blend-mode:multiply;box-shadow:0 40px 70px rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center}
.label{width:86%;height:74%;background:linear-gradient(180deg,#6a3fb5,#5b33a3);border-radius:6px;display:flex;align-items:center;justify-content:center;text-align:center;
 color:#fff;font-style:italic;font-size:50px;line-height:1.1;transform:skewX(-6deg);padding:0 30px}
.num{position:absolute;right:-6px;top:50%;transform:translate(100%,-50%);font-size:40px;color:#3a2a10}
.slide{animation:sale 3.6s cubic-bezier(.2,.8,.2,1) both}
@keyframes sale{0%{transform:translateX(-900px) rotateY(35deg) rotateZ(-6deg)}25%{transform:translateX(0) rotateY(0) rotateZ(2deg)}33%{transform:rotateZ(-1deg)}100%{transform:rotateZ(1deg) scale(1.07)}}
.ov{position:absolute;left:215px;top:285px;width:420px;height:580px;border-radius:32px;padding:40px 34px;transform:rotate(-8deg)}
.ov p{font-size:40px}.ov .stop{width:140px;height:140px;margin-top:30px}.ov .stop span{font-size:38px}
.pop{animation:pop 2.8s cubic-bezier(.2,.9,.25,1.2) both}
@keyframes pop{0%,8%{opacity:0;transform:translate(60px,120px) rotate(-20deg) scale(.35)}20%{opacity:1;transform:rotate(-6deg) scale(1.06)}28%{transform:rotate(-8deg) scale(1)}100%{opacity:1;transform:rotate(-9deg) scale(1.04)}}
</style></head><body><div id="c"></div><script>
const q=new URLSearchParams(location.search), V=q.get('v'), c=document.getElementById('c');
const bg=im=>`<div class="bg" style="background-image:url(${im})"></div><div class="vig"></div>`;
if(V==='stop') c.innerHTML=bg('bg_mesa.jpg')+`<div class="card in"><div class="conf"></div><p>Elige a alguien para que tome hasta que tú digas</p><div class="stop"><span>STOP</span></div></div>`;
if(V==='stopover'){document.body.style.background='transparent'; c.innerHTML=`<div class="card ov pop"><div class="conf"></div><p>Elige a alguien para que tome hasta que tú digas</p><div class="stop"><span>STOP</span></div></div>`;}
if(V==='pregunta') c.innerHTML=bg('bg_mesa.jpg')+`<div class="card in"><div class="conf"></div><p>Elige a alguien y <span class="pk">pregúntale</span> lo que quieras…</p></div>`;
if(V==='reglas') c.innerHTML=bg('bg_mesa.jpg')+`<div class="card in" style="padding:50px 46px"><div class="conf"></div><p style="font-size:40px;margin-bottom:20px">REGLAS DE JUEGO</p><p style="font-size:31px;line-height:1.3;text-align:left">• Mezcla las cartas y ponlas boca abajo en el centro<br>• Cada uno toma una carta, la lee en voz alta y <span class="pk">cumple lo que dice</span><br>• Guarda la carta <span class="pk">Comodín</span> hasta que decidas usarla</p></div>`;
if(V==='solteros') c.innerHTML=bg('bg_torre.jpg')+`<div class="block slide"><div class="label">RONDA de TRAGOS<br>solo los SOLTEROS</div></div>`;
</script></body></html>
