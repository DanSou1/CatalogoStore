<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExperienceLove</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="stylesheet" href="./css/main.css">
</head>
<body>
    <div class="wrapper">
        <a href="./carrito.html" class="boton-carrito-flotante" aria-label="Carrito">
            <span class="material-symbols-outlined">shopping_cart</span>
            <span class="numerito">0</span>
        </a>
        <header class="header-mobile">
            <h1 class="logo">Experience Love</h1>
            <div class="header-mobile-acciones">
                <a href="./carrito.html" class="boton-carrito-icono" aria-label="Carrito">
                    <span class="material-symbols-outlined">shopping_cart</span>
                    <span class="numerito">0</span>
                </a>
                <button class="open-menu" id="open-menu">
                    <span class="material-symbols-outlined">menu</span>
                </button>
            </div>
        </header>
        <aside>
            <button class="close-menu" id="close-menu">
                <span class="material-symbols-outlined">close</span>
            </button>
            <header>
                <a class="logo" href="index.html">
                    <img src="img/logo.png" alt="Experience Love">
                    <h1 class="logo-text">Experience Love</h1>
                    <p class="logo-sub">Premium Boutique</p>
                </a>
            </header>
            <nav>
                <ul class="menu">
                    <li>
                        <button id="todos" class="boton-menu boton-categoria active"><span class="material-symbols-outlined">grid_view</span> Todos los productos</button>
                    </li>
                    <li>
                        <button id="cosmeticos" class="boton-menu boton-categoria"><span class="material-symbols-outlined">spa</span> Cosmeticos</button>
                    </li>
                    <li>
                        <button id="Juegos" class="boton-menu boton-categoria"><span class="material-symbols-outlined">casino</span> Juegos</button>
                    </li>
                    <li>
                        <button id="Juguetes" class="boton-menu boton-categoria"><span class="material-symbols-outlined">toys</span> Juguetes</button>
                    </li>
                    <li>
                        <button id="Bondage" class="boton-menu boton-categoria"><span class="material-symbols-outlined">link</span> Bondage</button>
                    </li>
                    <li>
                        <button id="Lubricantes" class="boton-menu boton-categoria"><span class="material-symbols-outlined">opacity</span> Lubricantes sensoriales</button>
                    </li>
                    <li>
                        <button id="Sachet" class="boton-menu boton-categoria"><span class="material-symbols-outlined">inventory_2</span> Sachets</button>
                    </li>
                    <li class="promociones">
                        <button id="Promociones" class="boton-menu boton-categoria"><span class="material-symbols-outlined">local_offer</span> PROMOCIONES!</button>
                    </li>
                </ul>
            </nav>
            <footer>
                <p class="texto-footer">© 2025 Experience_Love</p>
            </footer>
        </aside>
        <main>
            <h2 class="titulo-principal" id="titulo-principal">Todos los productos</h2>
            <div id="contenedor-productos" class="contenedor-productos"><!-- Esto se va a rellenar con JS --></div>
        </main>
    </div>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker
                .register('./js/sw.js')
                .then(() => console.log('Service Worker registrado correctamente.'))
                .catch(err => console.error('Error al registrar el Service Worker:', err));
        }
    </script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="./js/main.js"></script>
    <script src="./js/menu.js"></script>
</body>
</html>
